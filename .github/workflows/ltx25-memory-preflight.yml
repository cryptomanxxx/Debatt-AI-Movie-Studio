name: LTX 2.5 Memory Preflight (no GPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install metadata client only
        run: python -m pip install 'huggingface_hub>=0.35,<2'
      - name: Compare official LTX 2.5 checkpoint sizes to measured Kaggle disk
        run: python scripts/ltx25_preflight.py --output preflight/ltx25-size-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ltx25-memory-preflight-${{ github.run_id }}
          path: preflight/ltx25-size-report.json
          retention-days: 7
