name: Synthetic video artifact demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-clip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate offline test pattern (not AI video)
        run: |
          mkdir -p output
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=midnightblue:s=640x360:r=24:d=2" -f lavfi -i "sine=frequency=440:duration=2" -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac output/synthetic-demo.mp4
          test -s output/synthetic-demo.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-mp4
          path: output/synthetic-demo.mp4
          if-no-files-found: error
          retention-days: 7
