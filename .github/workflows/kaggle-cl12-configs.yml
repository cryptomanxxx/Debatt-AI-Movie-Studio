name: Kaggle CL-12 ComfyUI Memory Configurations (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_gpu_use:
        description: "Type YES to spend free Kaggle GPU quota testing four no-model startup configurations"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: movie-studio-kaggle-gpu
  cancel-in-progress: false

jobs:
  config-probe:
    if: ${{ inputs.confirm_gpu_use == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      EXPERIMENT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require Kaggle credentials
        run: |
          test -n "$KAGGLE_USERNAME" || { echo "::error::Missing KAGGLE_USERNAME"; exit 1; }
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::Missing KAGGLE_API_TOKEN"; exit 1; }
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle>=2.2,<3' 'six>=1.16,<2'
      - name: Submit guarded CL-12 configuration probe
        run: python -m scripts.kaggle_cl12_config_probe --sha "$GITHUB_SHA" --run-id "$EXPERIMENT_RUN_ID" --username "$KAGGLE_USERNAME"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-studio-cl12-configs-${{ github.run_id }}
          path: kaggle-cl12-results/
          retention-days: 7
          if-no-files-found: warn
