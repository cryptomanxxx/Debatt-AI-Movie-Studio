name: Kaggle CL-42 Block 8 Metadata (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_kaggle_use:
        description: "Type YES to consume a Kaggle session"
        required: true
        type: string
      confirm_weight_download:
        description: "Type YES_I_APPROVE_Q2_WEIGHT_DOWNLOAD to download 8.46 GB GGUF"
        required: true
        type: string
      confirm_metadata_only:
        description: "Type YES_BLOCK8_METADATA_ONLY; no block inference is allowed"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: movie-studio-kaggle-gpu
  cancel-in-progress: false

jobs:
  block8-metadata:
    if: ${{ inputs.confirm_kaggle_use == 'YES' && inputs.confirm_weight_download == 'YES_I_APPROVE_Q2_WEIGHT_DOWNLOAD' && inputs.confirm_metadata_only == 'YES_BLOCK8_METADATA_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      EXPERIMENT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline metadata tests
        run: python -m unittest tests.test_kaggle_cl42_block8_metadata -v
      - name: Require Kaggle credentials
        run: |
          test -n "$KAGGLE_USERNAME" || { echo "::error::Missing KAGGLE_USERNAME"; exit 1; }
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::Missing KAGGLE_API_TOKEN"; exit 1; }
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle>=2.2,<3' 'six>=1.16,<2'
      - name: Submit read-only block 8 GGUF index probe
        run: python -m scripts.kaggle_cl42_block8_metadata --sha "$GITHUB_SHA" --run-id "$EXPERIMENT_RUN_ID" --username "$KAGGLE_USERNAME"
      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-studio-cl42-block8-metadata-${{ github.run_id }}
          path: kaggle-cl42-results/
          retention-days: 7
          if-no-files-found: warn
