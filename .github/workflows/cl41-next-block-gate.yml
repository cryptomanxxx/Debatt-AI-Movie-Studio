name: CL-41 Next Block Evidence Gate (manual CPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -q
      - name: Produce bounded next-block decision report
        run: python -m scripts.cl41_next_block_gate --output cl41-results/report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: cl41-next-block-evidence
          path: cl41-results/report.json
          retention-days: 7
