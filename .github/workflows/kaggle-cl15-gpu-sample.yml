name: Kaggle CL-15 Bounded Q2 GPU Tensor Sample (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_gpu_use:
        description: "Type YES to consume Kaggle T4 GPU quota"
        required: true
        type: string
      confirm_single_weight_download:
        description: "Type YES_I_APPROVE_Q2_WEIGHT_DOWNLOAD for a bounded 8.46 GB repeat download"
        required: true
        type: string
      confirm_gpu_tensor_copy:
        description: "Type YES_GPU_SAMPLE to copy up to 4 MiB of raw GGUF data to each GPU"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: movie-studio-kaggle-gpu
  cancel-in-progress: false

jobs:
  probe-gpu:
    if: ${{ inputs.confirm_gpu_use == 'YES' && inputs.confirm_single_weight_download == 'YES_I_APPROVE_Q2_WEIGHT_DOWNLOAD' && inputs.confirm_gpu_tensor_copy == 'YES_GPU_SAMPLE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      EXPERIMENT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require Kaggle credentials
        run: |
          test -n "$KAGGLE_USERNAME" || { echo "::error::Missing KAGGLE_USERNAME"; exit 1; }
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::Missing KAGGLE_API_TOKEN"; exit 1; }
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle>=2.2,<3' 'six>=1.16,<2'
      - name: Submit bounded GPU transfer probe
        run: python -m scripts.kaggle_cl15_gpu_sample --sha "$GITHUB_SHA" --run-id "$EXPERIMENT_RUN_ID" --username "$KAGGLE_USERNAME"
      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-studio-cl15-gpu-sample-${{ github.run_id }}
          path: kaggle-cl15-results/
          retention-days: 7
          if-no-files-found: warn
