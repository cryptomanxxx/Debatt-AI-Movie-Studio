name: Kaggle GPU Feasibility (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_gpu_use:
        description: "Type YES to spend Kaggle free GPU quota on a short hardware probe"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: movie-studio-kaggle-gpu
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ inputs.confirm_gpu_use == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL_SLUG: debatt-ai-movie-gpu-probe
      EXPERIMENT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require Kaggle credentials
        run: |
          test -n "$KAGGLE_USERNAME" || { echo "::error::Missing KAGGLE_USERNAME repository secret"; exit 1; }
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::Missing KAGGLE_API_TOKEN repository secret"; exit 1; }
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle>=2.2,<3' 'six>=1.16,<2'
      - name: Prepare and submit short Kaggle probe
        run: python scripts/kaggle_gpu_probe.py --sha "$GITHUB_SHA" --run-id "$EXPERIMENT_RUN_ID" --username "$KAGGLE_USERNAME"
      - name: Publish probe summary
        if: success()
        run: |
          python -c 'import json,os; d=json.load(open("kaggle-results/probe.json")); f=open(os.environ["GITHUB_STEP_SUMMARY"],"a"); f.write("## Kaggle GPU feasibility probe\\n\\n"+json.dumps(d,indent=2)+"\\n")'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-studio-kaggle-probe-${{ github.run_id }}
          path: kaggle-results/
          retention-days: 7
          if-no-files-found: warn
