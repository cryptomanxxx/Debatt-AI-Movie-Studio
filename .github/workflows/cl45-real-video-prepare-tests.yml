name: CL-45 Real Video Workflow Preparation (CPU only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test strict official API graph preparation without GPU
        run: python -m unittest discover -s tests -q
