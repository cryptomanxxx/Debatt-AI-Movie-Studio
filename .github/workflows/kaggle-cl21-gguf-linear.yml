name: Kaggle CL-21 Real GGUF Linear Forward (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_gpu_use:
        description: "Type YES to consume Kaggle T4 quota"
        required: true
        type: string
      confirm_weight_download:
        description: "Type YES_I_APPROVE_Q2_WEIGHT_DOWNLOAD to download 8.46 GB GGUF"
        required: true
        type: string
      confirm_single_layer_forward:
        description: "Type YES_SINGLE_GGUF_LAYER to execute one bounded GPU linear forward"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: movie-studio-kaggle-gpu
  cancel-in-progress: false

jobs:
  gguf-linear:
    if: ${{ inputs.confirm_gpu_use == 'YES' && inputs.confirm_weight_download == 'YES_I_APPROVE_Q2_WEIGHT_DOWNLOAD' && inputs.confirm_single_layer_forward == 'YES_SINGLE_GGUF_LAYER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      EXPERIMENT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require Kaggle credentials
        run: |
          test -n "$KAGGLE_USERNAME" || { echo "::error::Missing KAGGLE_USERNAME"; exit 1; }
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::Missing KAGGLE_API_TOKEN"; exit 1; }
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle>=2.2,<3' 'six>=1.16,<2'
      - name: Submit bounded real GGUF layer test
        run: python -m scripts.kaggle_cl21_gguf_linear --sha "$GITHUB_SHA" --run-id "$EXPERIMENT_RUN_ID" --username "$KAGGLE_USERNAME"
      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-studio-cl21-gguf-linear-${{ github.run_id }}
          path: kaggle-cl21-results/
          retention-days: 7
          if-no-files-found: warn
